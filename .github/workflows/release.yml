name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag (e.g. after a transient CI failure).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Installed through the Go module proxy rather than goreleaser-action,
      # which downloads from goreleaser.com and can fail independently.
      - name: Release
        run: go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
